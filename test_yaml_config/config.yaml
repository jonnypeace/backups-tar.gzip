defaults:
  destination: /home/jonny/backups
  excludes: []
  compress: true
  incremental_filename: backup.inc # Used to track changed between backups.
  retention:
    consolidate_after: 7 # Number of days
    keep_archives: 3

projects:
  docs:
    backup_filename: docs
    destination: /home/jonny/backups
    source: /home/jonny/Documents

  bingo:
    backup_filename: bingo_backup.tar.gz
    includes:
      - /home/jonny/bingo
      - /home/jonny/bingo1
    excludes:
      - .gitignore
